name: BTC Quant Guardian 24/7 (Private & Secure)

on:
  schedule:
    # Se ejecuta cada 30 minutos (óptimo para los 2.000 min gratis de repo privado)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Botón manual "Run workflow"

permissions:
  contents: write

jobs:
  evaluate-and-alert:
    name: Evaluate 6 Indicators & Alert Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Execute Quantitative Engine & Check Confluence
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 quant_bot_24_7.py

      - name: 💾 Persist State & Alert Cache (Prevent Duplicates)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_alert.json state.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist quant guardian state [skip ci]" && git push)
        continue-on-error: true
