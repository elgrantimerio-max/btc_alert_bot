name: BTC Quant Guardian 24/7 (Continuous Autonomous Engine)

on:
  schedule:
    # Se ejecuta en relevo continuo cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite pulsar "Run workflow" manualmente en cualquier momento
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'last_alert.json'
      - 'state.json'
      - 'journal.json'

concurrency:
  group: quant-guardian-24-7
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guardian-continuous-session:
    name: 24/7 Live Autonomous Monitoring (15s Tick Scan & Telegram Alerter)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: ⚡ Run Autonomous Quant Guardian 24/7 Continuous Session (45 min @ 15s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QUANT_TIMEFRAME: '1h'
        run: |
          python3 quant_bot_24_7.py --continuous --duration 2700 --interval 15

      - name: 💾 Final Handover State Sync & Git Push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin $(git branch --show-current) 2>/dev/null || true
          git add last_alert.json state.json journal.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: handover continuous session state [skip ci]" && git push)
        continue-on-error: true
