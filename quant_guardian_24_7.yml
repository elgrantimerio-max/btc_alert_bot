name: BTC Quant Guardian 24/7 (Telegram Automatism)

on:
  schedule:
    # Runs every 10 minutes automatically in the cloud
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  evaluate-and-alert:
    name: Evaluate 6 Indicators & Alert Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Execute Quantitative Engine & Check Confluence
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8635759809:AAF8YTMVkbVizhe2V7ciw_QtOktDqapJWo4' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '159239770' }}
        run: |
          python quant_bot_24_7.py

      - name: 💾 Persist State & Alert Cache (Prevent Duplicates)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_alert.json state.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist quant guardian state [skip ci]" && git push)
        continue-on-error: true
